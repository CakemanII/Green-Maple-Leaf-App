<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Editor</title>
    <link rel="stylesheet" href="css/status_editor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Main Content Area -->
    <div class="status-editor-container">
        <!-- Header with Save and Revert buttons -->
        <div class="status-editor-header">
            <h1 class="editor-title"></h1>
            <div class="editor-actions">
                <button id="main-revert-btn" class="collection-action-btn revert-btn deactivated" title="Revert all changes">Revert</button>
                <button id="main-save-btn" class="collection-action-btn save-btn deactivated" title="Save all changes to server">Save</button>
            </div>
        </div>
        
        <!-- Collections Container (scrollable vertically) -->
        <div class="collections-container">
            <!-- Collections will be dynamically generated here -->
        </div>
    </div>

<!-- Flag Creation Modal -->
    <div class="modal-overlay" id="flag-creation-prompt">
        <div class="flag-creation-modal">
            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title">Flag Editor</h2>
                <button class="modal-close-btn" id="flag-creation-close-btn">×</button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <!-- Basic Information Section -->
                <div class="modal-section">
                    <div class="form-grid-split">
                        <div class="form-left">
                            <h3 class="section-title">Basic Information</h3>
                            <div class="form-group">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-input" maxlength="75" placeholder="Enter flag name..." id="flag-title-input"/>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Description</label>
                                <textarea class="form-textarea" maxlength="2000" placeholder="Enter description..." id="flag-description-input"></textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Image</label>
                                <button class="file-upload-btn" id="flag-image-input"> <!--Temp-->
                                    📁 Choose File
                                </button>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Audio</label>
                                <button class="file-upload-btn" id="flag-audio-input"> <!--Temp-->
                                    📁 Choose File
                                </button>
                            </div>
                        </div>

                        <div class="form-right">
                            <h3 class="section-title">Preview</h3>
                            <div class="preview-box" id="flag-image-preview">
                                <span>Image preview will appear here</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Conditional Statements Section -->
                <div class="modal-section">
                    <h3 class="section-title" id="flag-conditions-section-title">Flag Conditionals</h3>
                    <div class="conditions" id="flag-conditions-container">
                        <div class="condition-body">
                            <!-- Conditional Groups will be dynamically added here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer Actions -->
            <div class="modal-actions">
                <button class="btn btn-secondary" id="flag-creation-cancel-btn">Cancel</button>
                <button class="btn btn-danger" id="flag-delete-btn" style="display: none;">Delete</button>
                <button class="btn btn-primary" id="save-flag-btn"></button>
            </div>
        </div>
    </div>

    <!-- Confirmation Dialog Modal -->
    <div class="modal-overlay" id="confirmation-dialog">
        <div class="confirmation-modal">
            <div class="modal-header">
                <h2 class="modal-title" id="confirmation-title">Confirm Action</h2>
            </div>
            <div class="modal-body">
                <p id="confirmation-message" style="color: #ffffff; font-size: 1rem; line-height: 1.5; margin: 0;"></p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="confirmation-no-btn">No</button>
                <button class="btn btn-danger" id="confirmation-yes-btn">Yes</button>
            </div>
        </div>
    </div>

    <!-- Shared Utilities -->
    <script type="module" src="../shared/compiled_js/utilities.js"></script>

    <!-- Global Configurations Reference -->
    <script type="module" src="../shared/compiled_js/global_statuses_reference.js"></script>

    <!-- Editor Communication Manager -->
    <script type="module" src="./compiled_js/collection_saving.js"></script>

    <!-- Collection Editor (Drag and Drop) -->
    <script type="module" src="./compiled_js/collection_editor.js"></script>

    <!-- Flag Editor -->
    <script type="module" src="./compiled_js/flag_editor.js"></script>
</body>
</html>
