<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geofence Editor - Green Maple Leaf App</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="../shared/css/leaflet/leaflet.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            font-size: 16px; /* Base font size */
        }

        /* Responsive scaling based on viewport */
        @media screen and (max-width: 1920px) {
            html { font-size: 16px; }
        }
        
        @media screen and (max-width: 1600px) {
            html { font-size: 14px; }
        }
        
        @media screen and (max-width: 1366px) {
            html { font-size: 12px; }
        }
        
        @media screen and (max-width: 1024px) {
            html { font-size: 11px; }
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0d0d0d;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        main {
            display: flex;
            height: 100vh;
        }
        
        #editor-side-panel {
            width: 17.5rem;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #editor-side-panel::-webkit-scrollbar {
            width: 0.5rem;
        }

        #editor-side-panel::-webkit-scrollbar-track {
            background: #0d0d0d;
            border-radius: 0.25rem;
        }

        #editor-side-panel::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 0.25rem;
        }

        #editor-side-panel::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
        
        .panel-section {
            padding: 0.9375rem;
        }
        
        #layers-container {
            max-height: 25rem;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        #layers-container::-webkit-scrollbar {
            width: 0.5rem;
        }
        
        #layers-container::-webkit-scrollbar-track {
            background: #0d0d0d;
            border-radius: 0.25rem;
        }
        
        #layers-container::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 0.25rem;
        }
        
        #layers-container::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
        
        .section-content {
            background-color: #242424;
            border: 0.0625rem solid #333333;
            border-radius: 0.5rem;
            padding: 0.75rem;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-size: 0.8125rem;
            font-weight: 600;
            letter-spacing: 0.03125rem;
            margin-bottom: 0.875rem;
            color: #6ba3ff;
        }
        
        .section-header i {
            font-size: 0.875rem;
        }
        
        .region-button {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            width: 100%;
            padding: 0.625rem 0.75rem;
            margin-bottom: 0.5rem;
            background-color: #0d0d0d;
            border: none;
            border-radius: 0.25rem;
            color: white;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .region-button:hover {
            background-color: #1a1a1a;
        }

        .region-button.active-tool {
            background-color: #2a4a6a;
            border: 2px solid #6ba3ff;
        }

        .region-button.active-tool:hover {
            background-color: #325a7a;
        }
        
        .region-button i {
            width: 1rem;
            font-size: 0.875rem;
        }
        
        .tool-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.625rem;
        }
        
        .tool-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            padding: 0.75rem 0.5rem;
            background-color: #0d0d0d;
            border: none;
            border-radius: 0.25rem;
            color: white;
            font-size: 0.6875rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .tool-button:hover {
            background-color: #1a1a1a;
        }

        .tool-button.active-tool {
            background-color: #2a4a6a;
            border: 2px solid #6ba3ff;
        }

        .tool-button.active-tool:hover {
            background-color: #325a7a;
        }
        
        .tool-button i {
            font-size: 1.125rem;
            transition: transform 0.3s ease;
        }
        
        /* Move tool - scale up on hover */
        #btn-tool-move:hover i,
        #btn-tool-move.active-tool:hover i {
            transform: scale(1.3);
        }
        
        /* Scale tool - scale up on hover */
        #btn-tool-scale:hover i,
        #btn-tool-scale.active-tool:hover i {
            transform: scale(1.3);
        }
        
        /* Rotate tool - rotate on hover */
        #btn-tool-rotate:hover i,
        #btn-tool-rotate.active-tool:hover i {
            animation: quickRotate 0.5s ease;
        }
        
        @keyframes quickRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Add anchor tool - full width button */
        #btn-tool-add-anchor {
            width: 100%;
            margin-bottom: 8px;
        }

        #btn-tool-add-anchor:hover i,
        #btn-tool-add-anchor.active-tool:hover i {
            animation: anchorDrop 0.6s ease;
        }

        /* Stop editing button hover animation */
        #btn-stop-editing:hover i {
            animation: stopEditingPulse 0.4s ease;
        }

        @keyframes stopEditingPulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Delete region button hover animation */
        #btn-delete-region:hover i {
            animation: deleteRegionShake 0.4s ease;
        }

        @keyframes deleteRegionShake {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-5deg) scale(1.1);
            }
            75% {
                transform: rotate(5deg) scale(1.1);
            }
        }

        @keyframes anchorDrop {
            0% {
                transform: translateY(-0.25rem);
                opacity: 0.7;
            }
            50% {
                transform: translateY(0.125rem);
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Convert to Freeform button - full width button with horizontal layout */
        #btn-convert-to-freeform {
            width: 100%;
            flex-direction: row;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        #btn-convert-to-freeform:hover i {
            transform: scale(1.1);
        }

        /* Bottom tool buttons container - side by side layout */
        .tool-buttons-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .tool-buttons-bottom .tool-button {
            width: 100%;
            flex-direction: column;
            gap: 0.375rem;
        }
        
        .toggle-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.625rem 0.75rem;
            background-color: #0d0d0d;
            border: none;
            border-radius: 0.25rem;
            color: white;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .toggle-button:hover {
            background-color: #1a1a1a;
        }
        
        .toggle-button.active {
            background-color: #6ba3ff;
            color: #0d0d0d;
        }
        
        .toggle-button.active:hover {
            background-color: #5a92ee;
        }
        
        .toggle-button i {
            font-size: 0.875rem;
            transition: transform 0.3s ease;
        }
        
        @keyframes anchorSwing {
            0%, 100% {
                transform: rotate(-15deg);
            }
            50% {
                transform: rotate(15deg);
            }
        }
        
        .layer-item {
            display: flex;
            gap: 0.625rem;
            padding: 0.625rem;
            margin-bottom: 0.375rem;
            background-color: #0d0d0d;
            border-radius: 0.25rem;
            cursor: grab;
            transition: background-color 0.2s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, opacity 0.2s ease;
            user-select: none;
            position: relative;
            will-change: transform;
        }
        
        .layer-item:hover {
            background-color: #1a1a1a;
            transform: translateX(0.25rem);
        }
        
        .layer-item.dragging {
            opacity: 0.9;
            cursor: grabbing;
            z-index: 1000;
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.5),
                        0 0 1rem rgba(107, 163, 255, 0.3);
            background-color: #1a1a1a;
            animation: dragJitter 0.9s ease-in-out infinite;
        }
        
        @keyframes dragJitter {
            0%, 100% {
                transform: scale(1.05) rotate(1.5deg) translateX(0);
            }
            25% {
                transform: scale(1.05) rotate(2.5deg) translateX(0.0625rem);
            }
            50% {
                transform: scale(1.05) rotate(1.8deg) translateX(-0.0625rem);
            }
            75% {
                transform: scale(1.05) rotate(2.2deg) translateX(0.03125rem);
            }
        }
        
        .layer-placeholder {
            height: 3.5rem;
            background: linear-gradient(90deg, 
                rgba(107, 163, 255, 0.1) 0%, 
                rgba(107, 163, 255, 0.25) 50%, 
                rgba(107, 163, 255, 0.1) 100%);
            border: 0.125rem dashed #6ba3ff;
            border-radius: 0.25rem;
            margin-bottom: 0.375rem;
            position: relative;
            overflow: hidden;
            animation: placeholderPulse 1.5s ease-in-out infinite;
        }
        
        .layer-placeholder::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(107, 163, 255, 0.4), 
                transparent);
            animation: placeholderShimmer 2s ease-in-out infinite;
        }
        
        @keyframes placeholderPulse {
            0%, 100% {
                border-color: rgba(107, 163, 255, 0.6);
                box-shadow: 0 0 0.5rem rgba(107, 163, 255, 0.2);
            }
            50% {
                border-color: rgba(107, 163, 255, 1);
                box-shadow: 0 0 1rem rgba(107, 163, 255, 0.4);
            }
        }
        
        @keyframes placeholderShimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 200%;
            }
        }
        
        .layer-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            color: #6ba3ff;
            flex-shrink: 0;
        }
        
        .layer-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .layer-name {
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .layer-actions {
            display: flex;
            gap: 0.375rem;
        }
        
        .layer-action-btn {
            width: 1.875rem;
            height: 1.875rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .layer-action-btn:hover {
            opacity: 0.8;
            transform: translateY(-0.125rem);
        }
        
        .layer-action-btn i {
            transition: transform 0.3s ease;
        }
        
        .layer-action-btn.edit {
            background-color: #4a90e2;
            color: white;
        }
        
        .layer-action-btn.edit:hover i {
            animation: editBounce 0.5s ease;
        }

        .layer-action-btn.edit.disabled {
            background-color: #555555;
            color: #888888;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .layer-action-btn.edit.disabled:hover {
            opacity: 0.6;
            transform: none;
        }

        .layer-action-btn.edit.disabled:hover i {
            animation: none;
        }

        .layer-action-btn.edit.active {
            background-color: #4a90e2;
            color: white;
            box-shadow: 0 0 0.625rem rgba(74, 144, 226, 0.5);
        }

        .layer-action-btn.edit.active:hover {
            background-color: #357abd;
        }
        
        .layer-action-btn.eye {
            background-color: #50c878;
            color: white;
        }

        .layer-action-btn.eye.hidden {
            background-color: #757575;
        }

        .layer-action-btn.eye.hidden i::before {
            content: "\f070"; /* fa-eye-slash */
        }
        
        .layer-action-btn.eye:hover i {
            animation: eyeBlink 0.3s ease;
        }

        .layer-action-btn.eye.hidden:hover i {
            animation: none;
        }
        
        .layer-action-btn.settings {
            background-color: #ffa500;
            color: white;
        }
        
        .layer-action-btn.settings:hover i {
            animation: settingsSpin 0.6s ease;
        }
        
        .layer-action-btn.delete {
            background-color: #e74c3c;
            color: white;
        }
        
        .layer-action-btn.delete:hover i {
            animation: deleteShake 0.5s ease;
        }
        
        @keyframes editBounce {
            0%, 100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-0.1875rem);
            }
            50% {
                transform: translateY(0);
            }
            75% {
                transform: translateY(-0.125rem);
            }
        }
        
        @keyframes eyeBlink {
            0%, 100% {
                transform: scaleY(1);
            }
            45%, 55% {
                transform: scaleY(0.1);
            }
        }
        
        @keyframes settingsSpin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(180deg);
            }
        }
        
        @keyframes deleteShake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-0.1875rem) rotate(-5deg);
            }
            50% {
                transform: translateX(0.1875rem) rotate(5deg);
            }
            75% {
                transform: translateX(-0.125rem) rotate(-3deg);
            }
        }
        
        #editor-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        #map-container {
            flex: 1;
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        .map-info {
            background-color: #1a1a1a;
            color: #888888;
            padding: 0.5rem 1rem;
            font-size: 0.6875rem;
            font-family: 'Inter', sans-serif;
            border-top: 0.0625rem solid #262626;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 1000;
        }
        
        .map-info-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .map-info-right {
            margin-left: auto;
            font-size: 0.625rem;
            opacity: 0.7;
        }
        
        /* Move Leaflet attribution to bottom bar */
        .leaflet-control-attribution {
            display: none !important;
        }
        
        /* Style zoom controls */
        .leaflet-control-zoom {
            border: none !important;
        }
        
        .leaflet-control-zoom a {
            background-color: #1a1a1a !important;
            color: white !important;
            border: 1px solid #262626 !important;
        }
        
        .leaflet-control-zoom a:hover {
            background-color: #262626 !important;
        }

        /* Selected anchor glow effect */
        .selected-anchor {
            filter: drop-shadow(0 0 8px rgba(107, 163, 255, 0.8)) 
                    drop-shadow(0 0 16px rgba(107, 163, 255, 0.6)) 
                    drop-shadow(0 0 24px rgba(107, 163, 255, 0.4)) !important;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(107, 163, 255, 0.8)) 
                        drop-shadow(0 0 16px rgba(107, 163, 255, 0.6)) 
                        drop-shadow(0 0 24px rgba(107, 163, 255, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 12px rgba(107, 163, 255, 1)) 
                        drop-shadow(0 0 20px rgba(107, 163, 255, 0.8)) 
                        drop-shadow(0 0 32px rgba(107, 163, 255, 0.6));
            }
        }

        /* Selected handle glow effect */
        .selected-handle {
            filter: drop-shadow(0 0 6px rgba(255, 187, 51, 0.8)) 
                    drop-shadow(0 0 12px rgba(255, 187, 51, 0.6)) !important;
        }

        /* Pivot anchor indicator (for rotate tool) */
        .pivot-anchor {
            filter: drop-shadow(0 0 10px rgba(147, 51, 234, 0.9)) 
                    drop-shadow(0 0 20px rgba(147, 51, 234, 0.7)) 
                    drop-shadow(0 0 30px rgba(147, 51, 234, 0.5)) !important;
            animation: pivot-pulse 2s ease-in-out infinite;
        }

        @keyframes pivot-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(147, 51, 234, 0.9)) 
                        drop-shadow(0 0 20px rgba(147, 51, 234, 0.7)) 
                        drop-shadow(0 0 30px rgba(147, 51, 234, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(147, 51, 234, 1)) 
                        drop-shadow(0 0 25px rgba(147, 51, 234, 0.9)) 
                        drop-shadow(0 0 40px rgba(147, 51, 234, 0.7));
            }
        }

        /* Scale anchor indicator (for scale tool) */
        .scale-anchor {
            filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.9)) 
                    drop-shadow(0 0 20px rgba(34, 197, 94, 0.7)) 
                    drop-shadow(0 0 30px rgba(34, 197, 94, 0.5)) !important;
            animation: scale-pulse 2s ease-in-out infinite;
        }

        @keyframes scale-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.9)) 
                        drop-shadow(0 0 20px rgba(34, 197, 94, 0.7)) 
                        drop-shadow(0 0 30px rgba(34, 197, 94, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(34, 197, 94, 1)) 
                        drop-shadow(0 0 25px rgba(34, 197, 94, 0.9)) 
                        drop-shadow(0 0 40px rgba(34, 197, 94, 0.7));
            }
        }

        /* Ghost anchor styling - less visible */
        .ghost-anchor {
            opacity: 0.3 !important;
        }

        /* Layer Info Section */
        .info-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 0.0625rem solid #333333;
        }

        .info-field:last-child {
            border-bottom: none;
        }

        .info-field-label {
            font-size: 0.75rem;
            color: #888888;
            font-weight: 500;
        }

        .info-field-value {
            font-size: 0.75rem;
            color: #ffffff;
            font-weight: 400;
        }

        .info-color-swatch {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.1875rem;
            border: 0.0625rem solid #666666;
            display: inline-block;
        }

        .info-field-value.with-swatch {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-field-input,
        .info-field-select {
            font-size: 0.75rem;
            color: #ffffff;
            background-color: transparent;
            border: none;
            padding: 0.25rem 0.5rem;
            width: 100%;
            font-weight: 400;
            text-align: right;
        }

        .info-field-select {
            cursor: pointer;
            background-color: #242424;
            color: #ffffff;
            border: none;
        }

        .info-field-select option {
            background-color: #2a2a2a;
            color: #ffffff;
        }

        .info-field-input:focus,
        .info-field-select:focus {
            outline: none;
        }

        .info-field-input::placeholder {
            color: #666666;
        }

        /* Remove spinner arrows from number inputs */
        .info-field-input[type="number"]::-webkit-inner-spin-button,
        .info-field-input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .info-field-input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* Color Picker Modal */
        .color-picker-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            pointer-events: none;
        }

        .color-picker-modal.active {
            display: block;
        }

        .color-picker-content {
            left: 18.5rem;
            background-color: #2a2a2a;
            border-radius: 0.5rem;
            padding: 0.625rem;
            display: flex;
            gap: 0;
            align-items: center;
            box-shadow: 0 0.25rem 1.25rem rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        .color-picker-canvas {
            /* Size will be set via canvas width/height attributes */
            border-radius: 0.25rem;
            cursor: crosshair;
            flex-shrink: 0;
            display: block;
        }

        .color-picker-right {
            display: flex;
            flex-direction: column;
            gap: 0;
            align-items: center;
            justify-content: space-between;
            /* Height set dynamically via inline style */
        }

        .color-picker-compare-box {
            width: 6.25rem;
            height: 6.25rem;
            display: flex;
            flex-direction: column;
            border-radius: 0.25rem;
            overflow: hidden;
            border: 0.0625rem solid #555555;
            flex-shrink: 0;
            gap: 0.125rem;
            padding: 0.125rem;
            background-color: #1a1a1a;
            margin-top: auto;
            margin-bottom: auto;
        }

        .color-picker-previous-color,
        .color-picker-current-color {
            flex: 1;
            width: 100%;
            border-radius: 0.125rem;
        }

        .color-picker-bottom-controls {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .color-picker-hue-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 17.5rem;
            height: 1.25rem;
            border-radius: 0.625rem;
            background: linear-gradient(to right,
                hsl(0, 100%, 50%),
                hsl(30, 100%, 50%),
                hsl(60, 100%, 50%),
                hsl(90, 100%, 50%),
                hsl(120, 100%, 50%),
                hsl(150, 100%, 50%),
                hsl(180, 100%, 50%),
                hsl(210, 100%, 50%),
                hsl(240, 100%, 50%),
                hsl(270, 100%, 50%),
                hsl(300, 100%, 50%),
                hsl(330, 100%, 50%),
                hsl(360, 100%, 50%)
            );
            outline: none;
            cursor: pointer;
            transform: rotate(270deg);
            flex-shrink: 0;
            margin: 0 -6.875rem;
        }

        .color-picker-hue-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 0.75rem;
            height: 1.5rem;
            border-radius: 0.125rem;
            background: #ffffff;
            border: 0.125rem solid #000000;
            cursor: pointer;
        }

        .color-picker-hue-slider::-moz-range-thumb {
            width: 0.75rem;
            height: 1.5rem;
            border-radius: 0.125rem;
            background: #ffffff;
            border: 2px solid #000000;
            cursor: pointer;
        }

        .color-picker-wheel {
            width: 200px;
            height: 200px;
            border: none;
            cursor: pointer;
        }

        .color-picker-input-container {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }

        .color-picker-hex-input {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 0.0625rem solid #555555;
            border-radius: 0.25rem;
            padding: 0.5rem;
            font-size: 0.875rem;
            width: 7.5rem;
            text-align: center;
        }

        .color-picker-confirm-btn {
            background-color: #64b5f6;
            color: #ffffff;
            border: none;
            border-radius: 0.25rem;
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            cursor: pointer;
            font-weight: 500;
        }

        .color-picker-confirm-btn:hover {
            background-color: #42a5f5;
        }

        .info-color-swatch {
            cursor: pointer;
        }

        .info-color-swatch:hover {
            border-color: #888888;
        }

        /* Tab Menu Styles */
        .tab-menu {
            display: none;
            position: fixed;
            background-color: #0d0d0d;
            border: 2px solid #404040;
            border-top: none;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            min-width: 180px;
            overflow: hidden;
        }

        .tab-menu-options-container {
            display: flex;
            flex-direction: column;
            padding: 4px;
            gap: 2px;
        }

        .tab-menu-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background-color: transparent;
            border: none;
            border-radius: 4px;
            color: #9ca3af;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            font-family: inherit;
        }

        .tab-menu-option:hover {
            background-color: #3a3a3a;
            color: #ffffff;
        }

        .tab-menu-option:active {
            background-color: #4a4a4a;
            color: #ffffff;
        }

        .tab-menu-option .menu-icon {
            font-size: 1.125rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            opacity: 0.9;
        }

        .tab-menu-option .menu-text {
            flex: 1;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <!-- Leaflet and dependencies -->
    <script src="../shared/js/leaflet/leaflet.js"></script>
    <script src="../shared/js/leaflet/leaflet.curve.js"></script>
    <script src="../shared/js/leaflet/pattern.js"></script>
    
    <main>
        <section id="editor-side-panel">
            <!-- Create Regions Section -->
            <div class="panel-section" id="sidebar-create-region-container">
                <div class="section-content">
                    <div class="section-header">
                        <i class="fas fa-plus-circle"></i>
                        <span>CREATE REGIONS</span>
                    </div>
                    <button class="region-button rectangle" id="btn-create-rectangle-region">
                        <i class="far fa-square"></i>
                        <span>Rectangle</span>
                    </button>
                    <button class="region-button circle" id="btn-create-circle-region">
                        <i class="far fa-circle"></i>
                        <span>Circle</span>
                    </button>
                    <button class="region-button freeform" id="btn-create-freeform-region">
                        <i class="fas fa-draw-polygon"></i>
                        <span>Free Form</span>
                    </button>
                </div>
            </div>
            
            <!-- Region Tools Section -->
            <div class="panel-section" id="sidebar-region-tools-container">
                <div class="section-content">
                    <div class="section-header">
                        <i class="fas fa-tools"></i>
                        <span>REGION TOOLS</span>
                    </div>
                    <div class="tool-buttons">
                        <button class="tool-button" id="btn-tool-move">
                            <i class="fas fa-arrows-alt"></i>
                            <span>Move</span>
                        </button>
                        <button class="tool-button" id="btn-tool-scale">
                            <i class="fas fa-expand-alt"></i>
                            <span>Scale</span>
                        </button>
                        <button class="tool-button" id="btn-tool-rotate">
                            <i class="fas fa-sync-alt"></i>
                            <span>Rotate</span>
                        </button>
                    </div>
                    <button class="tool-button" id="btn-tool-add-anchor">
                        <i class="fas fa-anchor"></i>
                        <span>Add Anchors</span>
                    </button>
                    <button class="tool-button" id="btn-tool-add-handles">
                        <i class="fas fa-sliders-h"></i>
                        <span>Add Handles</span>
                    </button>
                    <button class="tool-button" id="btn-convert-to-freeform">
                        <i class="fas fa-draw-polygon"></i>
                        <span>Convert to Freeform</span>
                    </button>
                    <div class="tool-buttons-bottom">
                        <button class="tool-button" id="btn-delete-region">
                            <i class="fas fa-trash"></i>
                            <span>Delete</span>
                        </button>
                        <button class="tool-button" id="btn-stop-editing">
                            <i class="fas fa-times-circle"></i>
                            <span>Stop Editing</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Layer Info Section -->
            <div class="panel-section" id="sidebar-region-info-container">
                <div class="section-content">
                    <div class="section-header">
                        <i class="fas fa-info-circle"></i>
                        <span>REGION INFO</span>
                    </div>
                    <div id="region-info-content">
                        <div class="info-field">
                            <span class="info-field-label">Name</span>
                            <input type="text" class="info-field-input" id="region-info-name" placeholder="Enter name">
                        </div>
                        <div class="info-field">
                            <span class="info-field-label">Type</span>
                            <span class="info-field-value" id="region-info-type">-</span>
                        </div>
                        <div class="info-field">
                            <span class="info-field-label">Restriction</span>
                            <select class="info-field-select" id="region-info-restriction">
                                <option value="unrestricted">Unrestricted</option>
                                <option value="restricted">Restricted</option>
                            </select>
                        </div>
                        <div class="info-field">
                            <span class="info-field-label">Visibility</span>
                            <select class="info-field-select" id="region-info-visibility">
                                <option value="visible">Visible</option>
                                <option value="hidden">Hidden</option>
                            </select>
                        </div>
                        <div class="info-field">
                            <span class="info-field-label">Fill Color</span>
                            <span class="info-field-value with-swatch" id="region-info-fill-color">
                                <span class="info-color-swatch" id="region-info-fill-color-swatch"></span>
                                <span id="region-info-fill-color-text">-</span>
                            </span>
                        </div>
                        <div class="info-field">
                            <span class="info-field-label">Border Color</span>
                            <span class="info-field-value with-swatch" id="region-info-border-color">
                                <span class="info-color-swatch" id="region-info-border-color-swatch"></span>
                                <span id="region-info-border-color-text">-</span>
                            </span>
                        </div>
                        <div class="info-field">
                            <span class="info-field-label">Fill Opacity</span>
                            <input type="number" class="info-field-input" id="region-info-fill-opacity" min="0" max="1" step="0.1" placeholder="0-1">
                        </div>
                        <div class="info-field">
                            <span class="info-field-label">Border Opacity</span>
                            <input type="number" class="info-field-input" id="region-info-border-opacity" min="0" max="1" step="0.1" placeholder="0-1">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Map Layers Section -->
            <div class="panel-section" id="sidebar-region-layers-container">
                <div class="section-content">
                    <div class="section-header">
                        <i class="fas fa-layer-group"></i>
                        <span>MAP LAYERS</span>
                    </div>
                    <div id="layers-container">
                        <!-- Layers will be dynamically added here -->
                    </div>
                </div>
            </div>
        </section>

        <section id="editor-container">
            <div id="map-container">
                <div id="map"></div>
            </div>
            <div class="map-info">
                <div class="map-info-left">
                    <span id="map-coords">Lat: 13.090179, Lng: -30.536698</span>
                    <span>•</span>
                    <span id="map-zoom">Zoom: 6</span>
                    <span>•</span>
                    <span id="map-mode">None</span>
                </div>
                <div class="map-info-right">
                    <span id="map-attribution">© <a href="https://www.maptiler.com/copyright/" target="_blank" style="color: #6ba3ff; text-decoration: none;">MapTiler</a></span>
                </div>
            </div>
        </section>
    </main>

    <!-- Tab Menu -->
    <div id="tab-menu" class="tab-menu">
        <div id="tab-menu-options-container" class="tab-menu-options-container">
            <button class="tab-menu-option" data-menu-key="save">
                <span class="menu-text">Save</span>
            </button>
            <button class="tab-menu-option" data-menu-key="save-as">
                <span class="menu-text">Save as</span>
            </button>
            <button class="tab-menu-option" data-menu-key="load">
                <span class="menu-text">Load</span>
            </button>
        </div>
    </div>

    <!-- Color Picker Modal -->
    <div class="color-picker-modal" id="color-picker-modal">
        <div class="color-picker-content">
            <input type="color" class="color-picker-wheel" id="color-picker-wheel" value="#ff7800">
            <div class="color-picker-input-container">
                <input type="text" class="color-picker-hex-input" id="color-picker-hex-input" placeholder="#000000">
                <button class="color-picker-confirm-btn" id="color-picker-confirm-btn">Confirm</button>
            </div>
        </div>
    </div>
    
    <!-- Load compiled TypeScript classes (non-module, in dependency order) -->
    <!-- -2. Shared Configuration Reference -->
    <script type="module" src="../shared/compiled_js/global_configs_reference.js"></script>

    <!-- -1. Shared Prompts Reference -->
    <script type="module" src="../shared/compiled_js/prompts.js"></script>

    <!-- Shared Tab Menu -->
    <script type="module" src="../shared/compiled_js/tabmenu.js"></script>

    <!-- 0. Load and Save Geoedit -->
    <script type="module" src="./compiled_js/geofence_filing.js"></script>

    <!-- 1. Base map -->
    <script type="module" src="./compiled_js/interactable_map/map.js"></script>
    
    <!-- 2. Anchor point (needed by editor) -->
    <script type="module" src="./compiled_js/interactable_map/anchor_point.js"></script>
    
    <!-- 3. Region classes (needed by editor) -->
    <script type="module" src="./compiled_js/interactable_map/region.js"></script>
    
    <!-- 4. Editor tools (needed by main editor) -->
    <script type="module" src="./compiled_js/interactable_map/map_region_editor_tools.js"></script>
    
    <!-- 5. Main editor (uses all above) -->
    <script type="module" src="./compiled_js/interactable_map/map_region_editor.js"></script>

    <!-- 6. Editor UI  -->
    <script type="module" src="./compiled_js/editor_ui/editor_ui.js"></script>
     
    
    <script>
        // Initialize map after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            const mapInstance = new InteractiveMap();
            console.log('Map initialized successfully');
            
            // Initialize the region editor
            const regionEditor = new MapRegionEditor();
            console.log('MapRegionEditor initialized successfully');
        });
    </script>
</body>
</html>
