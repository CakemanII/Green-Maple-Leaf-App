<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geofence Editor - Green Maple Leaf App</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="../shared/css/leaflet/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        main {
            display: flex;
            height: 100vh;
        }
        
        #editor-side-panel {
            width: 300px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        
        #editor-container {
            flex: 1;
            position: relative;
        }
        
        #map-container {
            width: 100%;
            height: 100%;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Leaflet and dependencies -->
    <script src="../shared/js/leaflet/leaflet.js"></script>
    <script src="../shared/js/leaflet/leaflet.curve.js"></script>
    <script src="../shared/js/leaflet/pattern.js"></script>
    
    <main>
        <section id="editor-side-panel">
            <!-- Geofence editor side panel will go here -->
            <!-- Will contain tools, add region, and region hierarchy -->
        </section>

        <section id="editor-container">
            <div id="map-container">
                <div id="map"></div>
            </div>
        </section>
    </main>
    
    <!-- Load compiled Map class (non-module) -->
    <script src="./compiled_js/interactable_map/map.js"></script>
    
    <script>
        // Initialize map after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            const mapInstance = new InteractiveMap();
            console.log('Map initialized successfully');
        });
    </script>
</body>
</html>
