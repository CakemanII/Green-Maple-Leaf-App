<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geofence Editor - Green Maple Leaf App</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="../shared/css/leaflet/leaflet.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0d0d0d;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        main {
            display: flex;
            height: 100vh;
        }
        
        #editor-side-panel {
            width: 280px;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
        }
        
        .panel-section {
            padding: 15px;
        }
        
        #layers-container {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        #layers-container::-webkit-scrollbar {
            width: 8px;
        }
        
        #layers-container::-webkit-scrollbar-track {
            background: #0d0d0d;
            border-radius: 4px;
        }
        
        #layers-container::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }
        
        #layers-container::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
        
        .section-content {
            background-color: #242424;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 12px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            color: #6ba3ff;
        }
        
        .section-header i {
            font-size: 14px;
        }
        
        .region-button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 8px;
            background-color: #0d0d0d;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .region-button:hover {
            background-color: #1a1a1a;
        }

        .region-button.active-tool {
            background-color: #2a4a6a;
            border: 2px solid #6ba3ff;
        }

        .region-button.active-tool:hover {
            background-color: #325a7a;
        }
        
        .region-button i {
            width: 16px;
            font-size: 14px;
        }
        
        .tool-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .tool-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 8px;
            background-color: #0d0d0d;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .tool-button:hover {
            background-color: #1a1a1a;
        }

        .tool-button.active-tool {
            background-color: #2a4a6a;
            border: 2px solid #6ba3ff;
        }

        .tool-button.active-tool:hover {
            background-color: #325a7a;
        }
        
        .tool-button i {
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        
        /* Move tool - scale up on hover */
        #btn-tool-move:hover i,
        #btn-tool-move.active-tool:hover i {
            transform: scale(1.3);
        }
        
        /* Scale tool - scale up on hover */
        #btn-tool-scale:hover i,
        #btn-tool-scale.active-tool:hover i {
            transform: scale(1.3);
        }
        
        /* Rotate tool - rotate on hover */
        #btn-tool-rotate:hover i,
        #btn-tool-rotate.active-tool:hover i {
            animation: quickRotate 0.5s ease;
        }
        
        @keyframes quickRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Add anchor tool - full width button */
        #btn-tool-add-anchor {
            width: 100%;
            margin-bottom: 8px;
        }

        #btn-tool-add-anchor:hover i,
        #btn-tool-add-anchor.active-tool:hover i {
            animation: anchorDrop 0.6s ease;
        }

        /* Stop editing button hover animation */
        #btn-stop-editing:hover i {
            animation: stopEditingPulse 0.4s ease;
        }

        @keyframes stopEditingPulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Delete region button hover animation */
        #btn-delete-region:hover i {
            animation: deleteRegionShake 0.4s ease;
        }

        @keyframes deleteRegionShake {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-5deg) scale(1.1);
            }
            75% {
                transform: rotate(5deg) scale(1.1);
            }
        }

        @keyframes anchorDrop {
            0% {
                transform: translateY(-4px);
                opacity: 0.7;
            }
            50% {
                transform: translateY(2px);
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Convert to Freeform button - full width button with horizontal layout */
        #btn-convert-to-freeform {
            width: 100%;
            flex-direction: row;
            gap: 8px;
            justify-content: center;
            margin-bottom: 8px;
        }

        #btn-convert-to-freeform:hover i {
            transform: scale(1.1);
        }

        /* Bottom tool buttons container - side by side layout */
        .tool-buttons-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .tool-buttons-bottom .tool-button {
            width: 100%;
            flex-direction: column;
            gap: 6px;
        }
        
        .toggle-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px 12px;
            background-color: #0d0d0d;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .toggle-button:hover {
            background-color: #1a1a1a;
        }
        
        .toggle-button.active {
            background-color: #6ba3ff;
            color: #0d0d0d;
        }
        
        .toggle-button.active:hover {
            background-color: #5a92ee;
        }
        
        .toggle-button i {
            font-size: 14px;
            transition: transform 0.3s ease;
        }
        
        @keyframes anchorSwing {
            0%, 100% {
                transform: rotate(-15deg);
            }
            50% {
                transform: rotate(15deg);
            }
        }
        
        .layer-item {
            display: flex;
            gap: 10px;
            padding: 10px;
            margin-bottom: 6px;
            background-color: #0d0d0d;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .layer-item:hover {
            background-color: #1a1a1a;
        }
        
        .layer-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #6ba3ff;
            flex-shrink: 0;
        }
        
        .layer-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .layer-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .layer-actions {
            display: flex;
            gap: 6px;
        }
        
        .layer-action-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .layer-action-btn:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }
        
        .layer-action-btn i {
            transition: transform 0.3s ease;
        }
        
        .layer-action-btn.edit {
            background-color: #4a90e2;
            color: white;
        }
        
        .layer-action-btn.edit:hover i {
            animation: editBounce 0.5s ease;
        }

        .layer-action-btn.edit.disabled {
            background-color: #555555;
            color: #888888;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .layer-action-btn.edit.disabled:hover {
            opacity: 0.6;
            transform: none;
        }

        .layer-action-btn.edit.disabled:hover i {
            animation: none;
        }

        .layer-action-btn.edit.active {
            background-color: #4a90e2;
            color: white;
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.5);
        }

        .layer-action-btn.edit.active:hover {
            background-color: #357abd;
        }
        
        .layer-action-btn.eye {
            background-color: #50c878;
            color: white;
        }

        .layer-action-btn.eye.hidden {
            background-color: #757575;
        }

        .layer-action-btn.eye.hidden i::before {
            content: "\f070"; /* fa-eye-slash */
        }
        
        .layer-action-btn.eye:hover i {
            animation: eyeBlink 0.3s ease;
        }

        .layer-action-btn.eye.hidden:hover i {
            animation: none;
        }
        
        .layer-action-btn.settings {
            background-color: #ffa500;
            color: white;
        }
        
        .layer-action-btn.settings:hover i {
            animation: settingsSpin 0.6s ease;
        }
        
        .layer-action-btn.delete {
            background-color: #e74c3c;
            color: white;
        }
        
        .layer-action-btn.delete:hover i {
            animation: deleteShake 0.5s ease;
        }
        
        @keyframes editBounce {
            0%, 100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-3px);
            }
            50% {
                transform: translateY(0);
            }
            75% {
                transform: translateY(-2px);
            }
        }
        
        @keyframes eyeBlink {
            0%, 100% {
                transform: scaleY(1);
            }
            45%, 55% {
                transform: scaleY(0.1);
            }
        }
        
        @keyframes settingsSpin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(180deg);
            }
        }
        
        @keyframes deleteShake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-3px) rotate(-5deg);
            }
            50% {
                transform: translateX(3px) rotate(5deg);
            }
            75% {
                transform: translateX(-2px) rotate(-3deg);
            }
        }
        
        #editor-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        #map-container {
            flex: 1;
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        .map-info {
            background-color: #1a1a1a;
            color: #888888;
            padding: 8px 16px;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            border-top: 1px solid #262626;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1000;
        }
        
        .map-info-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .map-info-right {
            margin-left: auto;
            font-size: 10px;
            opacity: 0.7;
        }
        
        /* Move Leaflet attribution to bottom bar */
        .leaflet-control-attribution {
            display: none !important;
        }
        
        /* Style zoom controls */
        .leaflet-control-zoom {
            border: none !important;
        }
        
        .leaflet-control-zoom a {
            background-color: #1a1a1a !important;
            color: white !important;
            border: 1px solid #262626 !important;
        }
        
        .leaflet-control-zoom a:hover {
            background-color: #262626 !important;
        }

        /* Selected anchor glow effect */
        .selected-anchor {
            filter: drop-shadow(0 0 8px rgba(107, 163, 255, 0.8)) 
                    drop-shadow(0 0 16px rgba(107, 163, 255, 0.6)) 
                    drop-shadow(0 0 24px rgba(107, 163, 255, 0.4)) !important;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(107, 163, 255, 0.8)) 
                        drop-shadow(0 0 16px rgba(107, 163, 255, 0.6)) 
                        drop-shadow(0 0 24px rgba(107, 163, 255, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 12px rgba(107, 163, 255, 1)) 
                        drop-shadow(0 0 20px rgba(107, 163, 255, 0.8)) 
                        drop-shadow(0 0 32px rgba(107, 163, 255, 0.6));
            }
        }

        /* Selected handle glow effect */
        .selected-handle {
            filter: drop-shadow(0 0 6px rgba(255, 187, 51, 0.8)) 
                    drop-shadow(0 0 12px rgba(255, 187, 51, 0.6)) !important;
        }

        /* Pivot anchor indicator (for rotate tool) */
        .pivot-anchor {
            filter: drop-shadow(0 0 10px rgba(147, 51, 234, 0.9)) 
                    drop-shadow(0 0 20px rgba(147, 51, 234, 0.7)) 
                    drop-shadow(0 0 30px rgba(147, 51, 234, 0.5)) !important;
            animation: pivot-pulse 2s ease-in-out infinite;
        }

        @keyframes pivot-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(147, 51, 234, 0.9)) 
                        drop-shadow(0 0 20px rgba(147, 51, 234, 0.7)) 
                        drop-shadow(0 0 30px rgba(147, 51, 234, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(147, 51, 234, 1)) 
                        drop-shadow(0 0 25px rgba(147, 51, 234, 0.9)) 
                        drop-shadow(0 0 40px rgba(147, 51, 234, 0.7));
            }
        }

        /* Scale anchor indicator (for scale tool) */
        .scale-anchor {
            filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.9)) 
                    drop-shadow(0 0 20px rgba(34, 197, 94, 0.7)) 
                    drop-shadow(0 0 30px rgba(34, 197, 94, 0.5)) !important;
            animation: scale-pulse 2s ease-in-out infinite;
        }

        @keyframes scale-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.9)) 
                        drop-shadow(0 0 20px rgba(34, 197, 94, 0.7)) 
                        drop-shadow(0 0 30px rgba(34, 197, 94, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(34, 197, 94, 1)) 
                        drop-shadow(0 0 25px rgba(34, 197, 94, 0.9)) 
                        drop-shadow(0 0 40px rgba(34, 197, 94, 0.7));
            }
        }

        /* Ghost anchor styling - less visible */
        .ghost-anchor {
            opacity: 0.3 !important;
        }

        /* Layer Info Section */
        .info-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333333;
        }

        .info-field:last-child {
            border-bottom: none;
        }

        .info-field-label {
            font-size: 12px;
            color: #888888;
            font-weight: 500;
        }

        .info-field-value {
            font-size: 12px;
            color: #ffffff;
            font-weight: 400;
        }

        .info-color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid #666666;
            display: inline-block;
        }

        .info-field-value.with-swatch {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-field-input,
        .info-field-select {
            font-size: 12px;
            color: #ffffff;
            background-color: transparent;
            border: none;
            padding: 4px 8px;
            width: 100%;
            font-weight: 400;
            text-align: right;
        }

        .info-field-select {
            cursor: pointer;
            background-color: #242424;
            color: #ffffff;
            border: none;
        }

        .info-field-select option {
            background-color: #2a2a2a;
            color: #ffffff;
        }

        .info-field-input:focus,
        .info-field-select:focus {
            outline: none;
        }

        .info-field-input::placeholder {
            color: #666666;
        }

        /* Remove spinner arrows from number inputs */
        .info-field-input[type="number"]::-webkit-inner-spin-button,
        .info-field-input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .info-field-input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* Color Picker Modal */
        .color-picker-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            pointer-events: none;
        }

        .color-picker-modal.active {
            display: block;
        }

        .color-picker-content {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            gap: 0;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        .color-picker-canvas {
            width: 280px;
            height: 280px;
            border-radius: 4px;
            cursor: crosshair;
            flex-shrink: 0;
        }

        .color-picker-right {
            display: flex;
            flex-direction: column;
            gap: 0;
            align-items: center;
            justify-content: space-between;
            height: 280px;
        }

        .color-picker-compare-box {
            width: 100px;
            height: 100px;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #555555;
            flex-shrink: 0;
            gap: 2px;
            padding: 2px;
            background-color: #1a1a1a;
            margin-top: auto;
            margin-bottom: auto;
        }

        .color-picker-previous-color,
        .color-picker-current-color {
            flex: 1;
            width: 100%;
            border-radius: 2px;
        }

        .color-picker-bottom-controls {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .color-picker-hue-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 280px;
            height: 20px;
            border-radius: 10px;
            background: linear-gradient(to right,
                hsl(0, 100%, 50%),
                hsl(30, 100%, 50%),
                hsl(60, 100%, 50%),
                hsl(90, 100%, 50%),
                hsl(120, 100%, 50%),
                hsl(150, 100%, 50%),
                hsl(180, 100%, 50%),
                hsl(210, 100%, 50%),
                hsl(240, 100%, 50%),
                hsl(270, 100%, 50%),
                hsl(300, 100%, 50%),
                hsl(330, 100%, 50%),
                hsl(360, 100%, 50%)
            );
            outline: none;
            cursor: pointer;
            transform: rotate(270deg);
            flex-shrink: 0;
            margin: 0 -110px;
        }

        .color-picker-hue-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 24px;
            border-radius: 2px;
            background: #ffffff;
            border: 2px solid #000000;
            cursor: pointer;
        }

        .color-picker-hue-slider::-moz-range-thumb {
            width: 12px;
            height: 24px;
            border-radius: 2px;
            background: #ffffff;
            border: 2px solid #000000;
            cursor: pointer;
        }

        .color-picker-wheel {
            width: 200px;
            height: 200px;
            border: none;
            cursor: pointer;
        }

        .color-picker-input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .color-picker-hex-input {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #555555;
            border-radius: 4px;
            padding: 8px;
            font-size: 14px;
            width: 120px;
            text-align: center;
        }

        .color-picker-confirm-btn {
            background-color: #64b5f6;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        .color-picker-confirm-btn:hover {
            background-color: #42a5f5;
        }

        .info-color-swatch {
            cursor: pointer;
        }

        .info-color-swatch:hover {
            border-color: #888888;
        }
    </style>
</head>
<body>
    <!-- Leaflet and dependencies -->
    <script src="../shared/js/leaflet/leaflet.js"></script>
    <script src="../shared/js/leaflet/leaflet.curve.js"></script>
    <script src="../shared/js/leaflet/pattern.js"></script>
    
    <main>
        <section id="editor-side-panel">
            <!-- Create Regions Section -->
            <div class="panel-section" id="sidebar-create-region-container">
                <div class="section-content">
                    <div class="section-header">
                        <i class="fas fa-plus-circle"></i>
                        <span>CREATE REGIONS</span>
                    </div>
                    <button class="region-button rectangle" id="btn-create-rectangle-region">
                        <i class="far fa-square"></i>
                        <span>Rectangle</span>
                    </button>
                    <button class="region-button circle" id="btn-create-circle-region">
                        <i class="far fa-circle"></i>
                        <span>Circle</span>
                    </button>
                    <button class="region-button freeform" id="btn-create-freeform-region">
                        <i class="fas fa-draw-polygon"></i>
                        <span>Free Form</span>
                    </button>
                </div>
            </div>
            
            <!-- Region Tools Section -->
            <div class="panel-section" id="sidebar-region-tools-container">
                <div class="section-content">
                    <div class="section-header">
                        <i class="fas fa-tools"></i>
                        <span>REGION TOOLS</span>
                    </div>
                    <div class="tool-buttons">
                        <button class="tool-button" id="btn-tool-move">
                            <i class="fas fa-arrows-alt"></i>
                            <span>Move</span>
                        </button>
                        <button class="tool-button" id="btn-tool-scale">
                            <i class="fas fa-expand-alt"></i>
                            <span>Scale</span>
                        </button>
                        <button class="tool-button" id="btn-tool-rotate">
