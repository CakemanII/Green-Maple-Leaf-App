<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Data — Green Maple Leaf</title>
    <style>
        :root{
            --bg:#0d0d0d;
            --panel:#1a1a1a;
            --card:#242424;
            --muted:#9ca3af;
            --accent:#6ba3ff;
            --graph-line:#f5a623;
            --border:#333333;
            --axis:#555555;
        }

        html{font-size:16px}
        @media screen and (max-width:1600px){html{font-size:14px}}
        @media screen and (max-width:1366px){html{font-size:12px}}

        html,body{height:100%;margin:0;}
        body{
            font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background-color:var(--bg);
            color:#ffffff;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            box-sizing:border-box;
        }

        .graphs-container{
            padding:18px;
        }

        .graph-row{
            display:flex;
            gap:12px;
            margin-bottom:12px;
            background-color:var(--card);
            border:1px solid var(--border);
            border-radius:0.5rem;
            padding:16px;
            align-items:center;
        }

        .graph-main{
            flex:5;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .graph-header{
            display:flex;
            align-items:center;
            margin-bottom:8px;
        }

        .graph-title{
            font-size:0.875rem;
            color:var(--accent);
            font-weight:600;
            margin:0;
        }

        .graph-content{
            display:flex;
            gap:8px;
            height:155px;
        }

        .y-axis-section{
            display:flex;
            gap:4px;
            height:140px;
        }

        .y-axis-title{
            writing-mode:vertical-rl;
            transform:rotate(180deg);
            font-size:0.7rem;
            color:var(--muted);
            display:flex;
            align-items:center;
            justify-content:center;
            min-width:20px;
            height:140px;
        }

        .y-axis-labels{
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            font-size:0.75rem;
            color:#6ba3ff;
            min-width:30px;
            height:140px;
        }

        .y-label{
            text-align:right;
            line-height:1;
        }

        .graph-canvas-wrapper{
            flex:1;
            display:flex;
            flex-direction:column;
        }

        .graph-canvas{
            position:relative;
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:4px;
            height:140px;
        }

        .graph-svg{
            width:100%;
            height:100%;
        }

        .x-axis-info{
            display:flex;
            align-items:center;
            justify-content:center;
            padding:6px 0;
            position:relative;
        }

        .x-axis-label{
            font-size:0.75rem;
            color:#6ba3ff;
            font-weight:500;
            position:absolute;
            right:0;
            top:50%;
            transform:translateY(-50%);
        }

        .x-axis-label-min{
            font-size:0.75rem;
            color:#6ba3ff;
            font-weight:500;
            position:absolute;
            left:0;
            top:50%;
            transform:translateY(-50%);
        }

        .x-axis-title{
            font-size:0.7rem;
            color:var(--muted);
        }

        .graph-info{
            flex:1;
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:4px;
            padding:16px;
            min-width:160px;
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .graph-info h3{
            margin:0;
            font-size:0.75rem;
            color:var(--accent);
            font-weight:600;
            text-transform:uppercase;
            letter-spacing:0.5px;
            padding-bottom:8px;
            border-bottom:1px solid var(--border);
        }

        .info-stats{
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:8px;
        }

        .info-item{
            display:flex;
            flex-direction:column;
            gap:4px;
            padding:8px;
            background-color:var(--card);
            border-radius:4px;
            border:1px solid var(--border);
        }

        .info-label{
            font-size:0.65rem;
            color:var(--muted);
            font-weight:500;
        }

        .info-value{
            font-size:0.75rem;
            color:#6ba3ff;
            font-weight:600;
        }
    </style>
</head>
<body>
    <div class="graphs-container" id="graphs-container">
        <!-- Graphs will be dynamically generated here -->
    </div>


    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <!-- Load compiled TypeScript classes (non-module, in dependency order) -->
    <!-- -2. Shared Configuration Reference -->
    <script src="../shared/compiled_js/global_configs_reference.js"></script>

    <!-- Telemetry Data Receiving -->
    <script src="../shared/compiled_js/global_rocket_communication_reference.js"></script>

    <!-- -1. Shared Prompts Reference -->
    <script src="../shared/compiled_js/prompts.js"></script>

    <!-- Derivative and Integral Calculator -->
    <script src="./compiled_js/derivative_integral_calculator.js"></script>

    <!-- Graph Representations -->
    <script src="./compiled_js/graph_representations.js"></script>

    <!-- Representation Manager -->
    <script src="./compiled_js/live_display.js"></script>
</body>
</html>
