<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Data — Green Maple Leaf</title>
    <link rel="stylesheet" href="css/live_data.css">
</head>
<body>
    <div class="statuses-container">
        <!-- Status cards will be dynamically generated here -->
    </div>

    <div class="graphs-container" id="graphs-container">
        <!-- Graphs will be dynamically generated here -->
    </div>

    <!-- Flag Creation Modal -->
    <div class="modal-overlay" id="flag-creation-prompt">
        <div class="flag-creation-modal">
            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title">Flag Editor</h2>
                <button class="modal-close-btn" id="flag-creation-close-btn">×</button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <!-- Basic Information Section -->
                <div class="modal-section">
                    <div class="form-grid-split">
                        <div class="form-left">
                            <h3 class="section-title">Basic Information</h3>
                            <div class="form-group">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-input" maxlength="75" placeholder="Enter flag name..." id="flag-title-input"/>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Description</label>
                                <textarea class="form-textarea" maxlength="2000" placeholder="Enter description..." id="flag-description-input"></textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="flag-status-select">
                                    <option value="">Select a status...</option>
                                    <option value="status1">Parachute Deployment</option>
                                    <option value="status2">Engine Status</option>
                                    <option value="new">+ Create New Status</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Image</label>
                                <button class="file-upload-btn" id="flag-image-input"> <!--Temp-->
                                    📁 Choose File
                                </button>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Audio</label>
                                <button class="file-upload-btn" id="flag-audio-input"> <!--Temp-->
                                    📁 Choose File
                                </button>
                            </div>
                        </div>

                        <div class="form-right">
                            <h3 class="section-title">Preview</h3>
                            <div class="preview-box" id="flag-image-preview">
                                <span>Image preview will appear here</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Conditional Statements Section -->
                <div class="modal-section">
                    <h3 class="section-title">Flag Conditionals</h3>
                    <div class="conditions" id="flag-conditions-container">
                        <div class="condition-body">
                            <!-- Conditional Groups will be dynamically added here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer Actions -->
            <div class="modal-actions">
                <button class="btn btn-secondary" id="flag-creation-cancel-btn">Cancel</button>
                <button class="btn btn-primary" id="save-flag-btn">Create Flag</button>
            </div>
        </div>
    </div>

    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script src="../shared/compiled_js/utilities.js"></script>

    <!-- Load compiled TypeScript classes (non-module, in dependency order) -->
    <!-- -2. Shared Configuration Reference -->
    <script src="../shared/compiled_js/global_configs_reference.js"></script>

    <!-- Telemetry Data Receiving -->
    <script src="../shared/compiled_js/global_rocket_communication_reference.js"></script>

    <!-- Statuses Reference -->
    <script src="../shared/compiled_js/global_statuses_reference.js"></script>

    <!-- -1. Shared Prompts Reference -->
    <script src="../shared/compiled_js/prompts.js"></script>

    <!-- Tab Menu -->
    <script src="../shared/compiled_js/tabmenu.js"></script>

    <!-- Status Representations -->
    <script src="./compiled_js/status_representations.js"></script>

    <!-- Graph Representations -->
    <script src="./compiled_js/graph_representations.js"></script>

    <!-- Representation Manager -->
    <script src="./compiled_js/live_display.js"></script>

    <!-- Status Creator -->
    <script src="./compiled_js/flag_editor.js"></script>
</body>
</html>
