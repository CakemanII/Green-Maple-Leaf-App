<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Data — Green Maple Leaf</title>
    <style>
        :root{
            --bg:#0d0d0d;
            --panel:#1a1a1a;
            --card:#242424;
            --muted:#9ca3af;
            --accent:#6ba3ff;
            --graph-line:#f5a623;
            --border:#333333;
            --axis:#555555;
        }

        html{font-size:16px}
        @media screen and (max-width:1600px){html{font-size:14px}}
        @media screen and (max-width:1366px){html{font-size:12px}}

        html,body{height:100%;margin:0;}
        body{
            font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background-color:var(--bg);
            color:#ffffff;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            box-sizing:border-box;
        }

        .graphs-container{
            padding:18px;
        }

        .graph-row{
            display:flex;
            gap:12px;
            margin-bottom:12px;
            background-color:var(--card);
            border:1px solid var(--border);
            border-radius:0.5rem;
            padding:16px;
            align-items:center;
        }

        .graph-main{
            flex:5;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .graph-header{
            display:flex;
            align-items:center;
            margin-bottom:8px;
        }

        .graph-title{
            font-size:0.875rem;
            color:var(--accent);
            font-weight:600;
            margin:0;
        }

        .graph-content{
            display:flex;
            gap:8px;
            height:155px;
        }

        .y-axis-section{
            display:flex;
            gap:4px;
            height:140px;
        }

        .y-axis-title{
            writing-mode:vertical-rl;
            transform:rotate(180deg);
            font-size:0.7rem;
            color:var(--muted);
            display:flex;
            align-items:center;
            justify-content:center;
            min-width:20px;
            height:140px;
        }

        .y-axis-labels{
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            font-size:0.75rem;
            color:#6ba3ff;
            min-width:30px;
            height:140px;
        }

        .y-label{
            text-align:right;
            line-height:1;
        }

        .graph-canvas-wrapper{
            flex:1;
            display:flex;
            flex-direction:column;
        }

        .graph-canvas{
            position:relative;
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:4px;
            height:140px;
        }

        .graph-svg{
            width:100%;
            height:100%;
        }

        .x-axis-info{
            display:flex;
            align-items:center;
            justify-content:center;
            padding:6px 0;
            position:relative;
        }

        .x-axis-label{
            font-size:0.75rem;
            color:#6ba3ff;
            font-weight:500;
            position:absolute;
            right:0;
            top:50%;
            transform:translateY(-50%);
        }

        .x-axis-label-min{
            font-size:0.75rem;
            color:#6ba3ff;
            font-weight:500;
            position:absolute;
            left:0;
            top:50%;
            transform:translateY(-50%);
        }

        .x-axis-title{
            font-size:0.7rem;
            color:var(--muted);
        }

        .graph-info{
            flex:1;
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:4px;
            padding:16px;
            min-width:160px;
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .graph-info h3{
            margin:0;
            font-size:0.75rem;
            color:var(--accent);
            font-weight:600;
            text-transform:uppercase;
            letter-spacing:0.5px;
            padding-bottom:8px;
            border-bottom:1px solid var(--border);
        }

        .info-stats{
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:8px;
        }

        .info-item{
            display:flex;
            flex-direction:column;
            gap:4px;
            padding:8px;
            background-color:var(--card);
            border-radius:4px;
            border:1px solid var(--border);
        }

        .info-label{
            font-size:0.65rem;
            color:var(--muted);
            font-weight:500;
        }

        .info-value{
            font-size:0.75rem;
            color:#6ba3ff;
            font-weight:600;
        }

        /* Status Display Styles */
        .statuses-container{
            padding:18px 18px 0 18px;
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }

        .status-card{
            background-color:var(--card);
            border:1px solid var(--border);
            border-radius:0.5rem;
            padding:16px;
            min-width:200px;
            max-width:250px;
            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
            gap:12px;
        }

        .status-name{
            font-size:1.125rem;
            color:var(--accent);
            font-weight:700;
            margin:0;
            letter-spacing:0.3px;
        }

        .status-flag{
            font-size:0.875rem;
            color:#6ba3ff;
            font-weight:600;
            padding:4px 0;
            width:100%;
        }

        .status-image{
            width:100%;
            height:150px;
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:4px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:3rem;
        }

        /* Flag Creation Modal Styles */
        .modal-overlay{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background-color:rgba(0, 0, 0, 0.85);
            z-index:1000;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .modal-overlay.active{
            display:flex;
        }

        .flag-creation-modal{
            background-color:var(--card);
            border:2px solid var(--accent);
            border-radius:12px;
            width:90%;
            max-width:1200px;
            max-height:90vh;
            overflow-y:auto;
            box-shadow:0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header{
            background-color:var(--panel);
            padding:24px 32px;
            border-bottom:2px solid var(--accent);
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .modal-title{
            font-size:1.75rem;
            color:var(--accent);
            font-weight:700;
            margin:0;
            letter-spacing:0.5px;
        }

        .modal-close-btn{
            background:none;
            border:none;
            color:var(--muted);
            font-size:2rem;
            cursor:pointer;
            padding:0;
            width:40px;
            height:40px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:4px;
            transition:all 0.2s;
        }

        .modal-close-btn:hover{
            background-color:var(--border);
            color:#ffffff;
        }

        .modal-body{
            padding:32px;
        }

        .modal-section{
            margin-bottom:32px;
        }

        .modal-section:last-child{
            margin-bottom:0;
        }

        .section-title{
            font-size:1rem;
            color:var(--accent);
            font-weight:600;
            margin:0 0 16px 0;
            text-transform:uppercase;
            letter-spacing:1px;
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:24px;
        }

        .form-grid-split{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:32px;
            align-items:start;
        }

        .form-left{
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .form-right{
            display:flex;
            flex-direction:column;
            padding-left:24px;
            padding-right: 38px;
        }

        .form-group{
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .form-label{
            font-size:0.875rem;
            color:var(--muted);
            font-weight:600;
        }

        .form-input{
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:6px;
            padding:12px 16px;
            color:#ffffff;
            font-size:0.875rem;
            font-family:inherit;
            transition:all 0.2s;
        }

        .form-input:focus{
            outline:none;
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(107, 163, 255, 0.1);
        }

        .form-textarea{
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:6px;
            padding:12px 16px;
            color:#ffffff;
            font-size:0.875rem;
            font-family:inherit;
            transition:all 0.2s;
            resize:vertical;
            min-height:20px;
            max-height: 560px;
        }

        .form-textarea:focus{
            outline:none;
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(107, 163, 255, 0.1);
        }

        .form-select{
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:6px;
            padding:12px 16px;
            color:#ffffff;
            font-size:0.875rem;
            font-family:inherit;
            cursor:pointer;
            transition:all 0.2s;
        }

        .form-select:focus{
            outline:none;
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(107, 163, 255, 0.1);
        }

        .file-upload-btn{
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:6px;
            padding:12px 16px;
            color:var(--muted);
            font-size:0.875rem;
            font-family:inherit;
            cursor:pointer;
            transition:all 0.2s;
            text-align:left;
            display:flex;
            align-items:center;
            gap:8px;
        }

        .file-upload-btn:hover{
            border-color:var(--accent);
            color:var(--accent);
        }

        .preview-box {
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:6px;
            padding:24px;
            display:flex;
            align-items:center;
            justify-content:center;
            aspect-ratio:1;
            width:100%;
            max-height:400px;
            color:var(--muted);
            font-size:0.875rem;
        }

        .conditions-placeholder {
            background-color:var(--panel);
            border:2px dashed var(--border);
            border-radius:6px;
            padding:32px 24px 32px 38px;
            min-height:150px;
            color:var(--muted);
            font-size:0.875rem;
        }

        .condition-group {
            background-color:var(--card);
            border:1px solid var(--border);
            border-radius:8px;
            overflow:hidden;
            max-width:75%;
        }

        .condition-header {
            background-color:var(--panel);
            border-bottom:1px solid var(--border);
            padding:12px 16px;
            display:flex;
            align-items:center;
            gap:12px;
        }

        .toggle-btn {
            background-color:var(--card);
            border:1px solid var(--border);
            border-radius:4px;
            padding:6px 12px;
            color:var(--muted);
            font-size:0.75rem;
            font-weight:600;
            cursor:pointer;
            transition:all 0.2s;
            text-transform:uppercase;
            letter-spacing:0.5px;
        }

        .toggle-btn:hover {
            border-color:var(--accent);
            color:var(--accent);
        }

        .toggle-btn.active {
            background-color:var(--accent);
            border-color:var(--accent);
            color:#ffffff;
        }

        .condition-name-input {
            flex:1;
            background-color:var(--card);
            border:1px solid var(--border);
            border-radius:4px;
            padding:6px 12px;
            color:#ffffff;
            font-size:0.875rem;
            font-family:inherit;
        }

        .condition-name-input:focus {
            outline:none;
            border-color:var(--accent);
        }

        .color-indicator {
            width:24px;
            height:24px;
            border-radius:4px;
            border:1px solid var(--border);
            cursor:pointer;
            transition:all 0.2s;
        }

        .color-indicator:hover {
            border-color:var(--accent);
        }

        .condition-body {
            padding:16px;
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .condition-row {
            background-color:var(--panel);
            border:1px solid var(--border);
            border-radius:6px;
            padding:12px 16px;
            display:flex;
            align-items:center;
            gap:12px;
        }

        .condition-select {
            background-color:var(--card);
            border:1px solid var(--border);
            border-radius:4px;
            padding:6px 10px;
            color:#ffffff;
            font-size:0.75rem;
            font-family:inherit;
            cursor:pointer;
            max-width:50%;
        }

        .condition-select:focus {
            outline:none;
            border-color:var(--accent);
        }

        .condition-operator {
            background-color:var(--card);
            border:1px solid var(--border);
            border-radius:4px;
            padding:6px 10px;
            color:var(--muted);
            font-size:0.75rem;
            min-width:60px;
            text-align:center;
        }

        .condition-value-input {
            background-color:var(--card);
            border:1px solid var(--border);
            border-radius:4px;
            padding:6px 10px;
            color:#ffffff;
            font-size:0.75rem;
            font-family:inherit;
            width:100px;
        }

        .condition-value-input:focus {
            outline:none;
            border-color:var(--accent);
        }

        .add-condition-btn {
            background-color:var(--panel);
            border:1px dashed var(--border);
            border-radius:6px;
            padding:10px 16px;
            color:var(--muted);
            font-size:0.75rem;
            font-weight:600;
            cursor:pointer;
            transition:all 0.2s;
            text-align:center;
            flex:1;
        }

        .add-condition-btn:hover {
            border-color:var(--accent);
            color:var(--accent);
            border-style:solid;
        }

        .button-row {
            display:flex;
            gap:12px;
        }

        .add-group-btn {
            background-color:var(--panel);
            border:1px dashed var(--border);
            border-radius:6px;
            padding:10px 16px;
            color:var(--muted);
            font-size:0.75rem;
            font-weight:600;
            cursor:pointer;
            transition:all 0.2s;
            text-align:center;
            width:100%;
        }

        .add-group-btn:hover {
            border-color:var(--accent);
            color:var(--accent);
            border-style:solid;
        }

        .modal-actions {
            display:flex;
            gap:12px;
            justify-content:flex-end;
            padding:24px 32px;
            border-top:1px solid var(--border);
        }

        .btn{
            padding:12px 24px;
            border-radius:6px;
            font-size:0.875rem;
            font-weight:600;
            cursor:pointer;
            transition:all 0.2s;
            border:none;
            font-family:inherit;
        }

        .btn-primary{
            background-color:var(--accent);
            color:#ffffff;
        }

        .btn-primary:hover{
            background-color:#5a8fdb;
        }

        .btn-secondary{
            background-color:var(--panel);
            color:var(--muted);
            border:1px solid var(--border);
        }

        .btn-secondary:hover{
            background-color:var(--card);
            color:#ffffff;
        }
    </style>
</head>
<body>
    <div class="statuses-container">
        <!-- Status cards will be dynamically generated here -->
    </div>

    <div class="graphs-container" id="graphs-container">
        <!-- Graphs will be dynamically generated here -->
    </div>

    <!-- Flag Creation Modal -->
    <div class="modal-overlay" id="flagCreationModal">
        <div class="flag-creation-modal">
            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title">Flag Creation</h2>
                <button class="modal-close-btn" onclick="closeFlagCreationModal()">×</button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <!-- Basic Information Section -->
                <div class="modal-section">
                    <div class="form-grid-split">
                        <div class="form-left">
                            <h3 class="section-title">Basic Information</h3>
                            <div class="form-group">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-input" maxlength="75" placeholder="Enter flag name..." />
                            </div>

                            <div class="form-group">
                                <label class="form-label">Description</label>
                                <textarea class="form-textarea" maxlength="2000" placeholder="Enter description..."></textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Status</label>
                                <select class="form-select">
                                    <option value="">Select a status...</option>
                                    <option value="status1">Parachute Deployment</option>
                                    <option value="status2">Engine Status</option>
                                    <option value="new">+ Create New Status</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Image</label>
                                <button class="file-upload-btn">
                                    📁 Choose File
                                </button>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Audio</label>
                                <button class="file-upload-btn">
                                    📁 Choose File
                                </button>
                            </div>
                        </div>

                        <div class="form-right">
                            <h3 class="section-title">Preview</h3>
                            <div class="preview-box">
                                <span>Image preview will appear here</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Conditional Statements Section -->
                <div class="modal-section">
                    <h3 class="section-title">Flag Conditionals</h3>
                    <div class="conditions-placeholder">
                        <!-- Sample Condition Group -->
                        <div class="condition-group">
                            <div class="condition-header">
                                <button class="toggle-btn">Not</button>
                                <input type="text" class="condition-name-input" placeholder="Group Name..." value="Conditional Group" />
                                <div class="color-indicator" style="background-color:#f5a623;" title="Click to change color"></div>
                                <button class="toggle-btn active">And</button>
                            </div>
                            <div class="condition-body">
                                <div class="condition-row">
                                    <select class="condition-select" style="flex:1;">
                                        <option value="" selected>Select Telemetry...</option>
                                        <option value="dps_alt">DPS Altitude</option>
                                        <option value="dps_vel">DPS Velocity</option>
                                        <option value="ang_vel">Angular Velocity</option>
                                    </select>
                                    <select class="condition-operator">
                                        <option value="==">=</option>
                                        <option value="!=">!=</option>

                                        <option value=">">></option>
                                        <option value="!>">!></option>

                                        <option value="<"><</option>
                                        <option value="!<">!<</option>

                                        <option value=">=">≥</option>
                                        <option value="!>=">!≥</option>

                                        <option value="<=">≤</option>
                                        <option value="!<=">!≤</option>
                                    </select>
                                    <input type="number" step="1" class="condition-value-input" placeholder="Value..." value="0" />
                                </div>
                                <div class="condition-row">
                                    <select class="condition-select">
                                        <option value="">Select Status...</option>
                                        <option value="status1">Parachute Deployment</option>
                                        <option value="status2">Engine Status</option>
                                        <option value="status3">Altitude Warning</option>
                                    </select>
                                    <select class="condition-operator">
                                        <option value="is">is</option>
                                        <option value="isnot">is not</option>
                                    </select>
                                    <select class="condition-select">
                                        <option value="">Flag</option>
                                        <option value="flag1">Nominal</option>
                                        <option value="flag2">Warning</option>
                                        <option value="flag3">Critical</option>
                                    </select>
                                </div>
                                <div class="button-row">
                                    <button class="add-condition-btn">+ Add Telemetry Condition</button>
                                    <button class="add-condition-btn">+ Add Status Conditional</button>
                                </div>
                                <button class="add-group-btn">+ Add Conditional Group</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer Actions -->
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeFlagCreationModal()">Cancel</button>
                <button class="btn btn-primary">Create Flag</button>
            </div>
        </div>
    </div>

    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script src="../shared/compiled_js/utilities.js"></script>

    <!-- Load compiled TypeScript classes (non-module, in dependency order) -->
    <!-- -2. Shared Configuration Reference -->
    <script src="../shared/compiled_js/global_configs_reference.js"></script>

    <!-- Telemetry Data Receiving -->
    <script src="../shared/compiled_js/global_rocket_communication_reference.js"></script>

    <!-- Statuses Reference -->
    <script src="../shared/compiled_js/global_statuses_reference.js"></script>

    <!-- -1. Shared Prompts Reference -->
    <script src="../shared/compiled_js/prompts.js"></script>

    <script src="./compiled_js/status_representations.js"></script>

    <!-- Graph Representations -->
    <script src="./compiled_js/graph_representations.js"></script>

    <!-- Representation Manager -->
    <script src="./compiled_js/live_display.js"></script>

    <script>
        // Placeholder functions for modal control
        function closeFlagCreationModal() {
            document.getElementById('flagCreationModal').classList.remove('active');
        }

        function openFlagCreationModal() {
            document.getElementById('flagCreationModal').classList.add('active');
        }
        openFlagCreationModal();

        // For testing: Open modal with a button or console command
        // Call openFlagCreationModal() in console to test
    </script>
</body>
</html>
