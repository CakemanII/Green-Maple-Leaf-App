<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Maple Leaf App</title>
    <style>
        .iframe-container {
            width: 70%;
            margin: 0 auto;
            position: relative;
            border: 4px solid #000;
        }
        
        .iframe-container::before {
            content: "";
            display: block;
            padding-top: 56.25%; /* 1080/1920 * 100% = 56.25% for 1920:1080 ratio */
        }
        
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Green Maple Leaf App</h1>
        <p style="text-align: center;">This is just the iframe for right now!</p>
    </header>
    
    <main>
        <div class="iframe-container">
            <iframe src="../geofence_editor/geofence_editor.html" title="Main Content"></iframe>
        </div>
    </main>
</body>
</html>
