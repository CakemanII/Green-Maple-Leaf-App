<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Maple Leaf App</title>
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0d0d0d;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .top-nav {
            background-color: #1a1a1a;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 45px;
            padding: 0 15px;
            position: relative; /* allow absolutely positioned decor */
        }
        
        .nav-tabs {
            display: flex;
            gap: 4px;
            height: 100%;
            align-items: center;
            margin-left: 44px; /* leave room for decorative leaf */
        }

        /* Decorative leaf (non-interactive) */
        .nav-decor {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            pointer-events: none; /* non-interactive */
            opacity: 0.95;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-decor img {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .nav-tab {
            padding: 12px 20px;
            background-color: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #888888;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            height: 100%;
            display: flex;
            align-items: center;
        }
        
        .nav-tab:hover {
            background-color: #242424;
            color: #ffffff;
        }
        
        .nav-tab.active {
            color: #6ba3ff;
            border-bottom-color: #6ba3ff;
            background-color: #0d0d0d;
        }

        .nav-tab.disabled {
            color: #363636;
            user-select: none;
            cursor: not-allowed;
        }
        
        .nav-tab.disabled:hover {
            background-color: transparent;
        }
        
        .nav-right-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }
        
        .connectivity-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: #242424;
            border: 2px solid #333333;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .connectivity-indicator.online .indicator-dot {
            background-color: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }
        
        .connectivity-indicator.online {
            border-color: #4ade80;
        }
        
        .connectivity-indicator.online .indicator-text {
            color: #4ade80;
        }
        
        .connectivity-indicator.starting .indicator-dot {
            background-color: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .connectivity-indicator.starting {
            border-color: #fbbf24;
        }
        
        .connectivity-indicator.starting .indicator-text {
            color: #fbbf24;
        }
        
        .connectivity-indicator.offline .indicator-dot {
            background-color: #888888;
        }
        
        .connectivity-indicator.offline {
            border-color: #333333;
        }
        
        .connectivity-indicator.offline .indicator-text {
            color: #888888;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .indicator-text {
            font-weight: 600;
            white-space: nowrap;
        }
        
        .nav-toggle-btn {
            padding: 8px 16px;
            background-color: #242424;
            color: #888888;
            border: 2px solid #333333;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .nav-toggle-btn:hover {
            background-color: #2a2a2a;
            border-color: #6ba3ff;
            color: #ffffff;
        }
        
        .nav-toggle-btn.active {
            background-color: #6ba3ff;
            color: #181a1b;
            border-color: #6ba3ff;
        }
        
        .nav-toggle-btn.active:hover {
            background-color: #5a92ee;
            border-color: #5a92ee;
        }
        
        .content-container {
            width: 100%;
            height: calc(100vh - 45px);
            position: relative;
        }
        
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 0px;
            height: 0px;
            border: none;
            display: none;
        }
        
        iframe.active {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-decor" aria-hidden="true">
            <!-- decorative leaf loaded from external asset -->
            <img src="./assets/leaf.png" alt="" aria-hidden="true" />
        </div>
        <div class="nav-tabs">
            <button id="live_interface_tab_button" class="nav-tab">Live Interface</button>
            <button id="live_data_tab_button" class="nav-tab">Live Data</button>
            <button id="status_editor_tab_button" class="nav-tab">Status Editor</button>
            <button id="geofence_editor_tab_button" class="nav-tab">Geofence Editor</button>
            <button id="preferences_tab_button" class="nav-tab">Preferences</button>
            <button id="settings_tab_button" class="nav-tab">Settings</button>
        </div>
        <div class="nav-right-section">
            <div id="rocket-connectivity-indicator" class="connectivity-indicator online" title="Rocket Status: Online">
                <div class="indicator-dot"></div>
                <span class="indicator-text">Online</span>
            </div>
            <button id="nav-toggle-btn" class="nav-toggle-btn" title="Toggle state">
                <span class="toggle-label">Loading</span>
            </button>
        </div>
    </nav>
    
    <div class="content-container">
        <iframe id="live_interface_tab" src="" title="Live Interface"></iframe>
        <iframe id="live_data_tab" src="/live_data.html" title="Live Data"></iframe>
        <iframe id="status_editor_tab" src="/status_editor.html" title="Status Editor"></iframe>
        <iframe id="geofence_editor_tab" src="/geofence_editor.html" title="Geofence Editor"></iframe>
        <iframe id="preferences_tab" src="/preferences.html" title="Preferences"></iframe>
        <iframe id="settings_tab" src="" title="Settings"></iframe>
    </div>

    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script type="module" src="../shared/compiled_js/utilities.js"></script>

    <script type="module" src="./compiled_js/tab_handler.js"></script>

    <script type="module" src="./compiled_js/global_preferences.js"></script>

    <script type="module" src="./compiled_js/derivative_integral_handling.js"></script>

    <script type="module" src="./compiled_js/global_rocket_communication.js"></script>

    <script type="module" src="./compiled_js/application_operational_state.js"></script>

    <script type="module" src="./compiled_js/global_statuses.js"></script>

    <script>
        // Rocket Operation Dialog
        function showRocketOperationDialog() {
            // Create overlay
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.7);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10000;
            `;

            // Create dialog
            const dialog = document.createElement('div');
            dialog.style.cssText = `
                background-color: #2a2a2a;
                border-radius: 8px;
                padding: 24px;
                min-width: 450px;
                max-width: 550px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            `;

            // Create title
            const titleEl = document.createElement('h3');
            titleEl.textContent = 'Rocket operation';
            titleEl.style.cssText = `
                margin: 0 0 20px 0;
                color: white;
                font-size: 20px;
                font-weight: 600;
            `;

            // Create content container
            const contentContainer = document.createElement('div');
            contentContainer.style.cssText = `
                display: flex;
                flex-direction: column;
                gap: 16px;
                margin-bottom: 24px;
            `;

            // Activate button container
            const activateBtnContainer = document.createElement('div');
            activateBtnContainer.style.cssText = `
                display: flex;
                justify-content: center;
                padding-bottom: 8px;
            `;

            const activateBtn = document.createElement('button');
            activateBtn.textContent = 'Activate';
            activateBtn.style.cssText = `
                padding: 10px 24px;
                background-color: #6ba3ff;
                color: #181a1b;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
            `;
            activateBtn.onmouseover = () => { activateBtn.style.backgroundColor = '#5a92ee'; };
            activateBtn.onmouseout = () => { activateBtn.style.backgroundColor = '#6ba3ff'; };
            
            activateBtnContainer.appendChild(activateBtn);

            // Runtime label
            const runtimeLabel = document.createElement('div');
            runtimeLabel.textContent = 'Shows runtime when running, N/A otherwise';
            runtimeLabel.style.cssText = `
                color: #888888;
                font-size: 12px;
                font-style: italic;
                text-align: center;
                margin-bottom: 8px;
            `;

            // Server Runtime
            const runtimeContainer = document.createElement('div');

            const runtimeLabelText = document.createElement('label');
            runtimeLabelText.textContent = 'Server Runtime:';
            runtimeLabelText.style.cssText = `
                color: #cccccc;
                font-size: 14px;
                font-weight: 500;
                margin-bottom: 4px;
                display: block;
            `;

            const runtimeValue = document.createElement('div');
            runtimeValue.textContent = '0:00:00:000';
            runtimeValue.style.cssText = `
                padding: 10px 12px;
                background-color: #1a1a1a;
                color: #6ba3ff;
                border: 1px solid #555555;
                border-radius: 4px;
                font-size: 14px;
                font-family: monospace;
                font-weight: 600;
                text-align: center;
            `;

            runtimeContainer.appendChild(runtimeLabelText);
            runtimeContainer.appendChild(runtimeValue);

            // Server Status
            const statusContainer = document.createElement('div');

            const statusLabelText = document.createElement('label');
            statusLabelText.textContent = 'Server Status:';
            statusLabelText.style.cssText = `
                color: #cccccc;
                font-size: 14px;
                font-weight: 500;
                margin-bottom: 4px;
                display: block;
            `;

            const statusValue = document.createElement('div');
            statusValue.textContent = 'Online';
            statusValue.style.cssText = `
                padding: 10px 12px;
                background-color: #1a1a1a;
                color: #4ade80;
                border: 1px solid #555555;
                border-radius: 4px;
                font-size: 14px;
                font-weight: 600;
                text-align: center;
            `;

            const statusOptions = document.createElement('div');
            statusOptions.textContent = 'Status: Online | Starting | Offline';
            statusOptions.style.cssText = `
                color: #888888;
                font-size: 12px;
                font-style: italic;
                text-align: center;
                margin-top: 4px;
            `;

            statusContainer.appendChild(statusLabelText);
            statusContainer.appendChild(statusValue);
            statusContainer.appendChild(statusOptions);

            // Assemble content
            contentContainer.appendChild(activateBtnContainer);
            contentContainer.appendChild(runtimeLabel);
            contentContainer.appendChild(runtimeContainer);
            contentContainer.appendChild(statusContainer);

            // Close button
            const closeBtn = document.createElement('button');
            closeBtn.textContent = 'Close';
            closeBtn.style.cssText = `
                padding: 10px 24px;
                background-color: #3a3a3a;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
                width: 100%;
            `;
            closeBtn.onmouseover = () => { closeBtn.style.backgroundColor = '#4a4a4a'; };
            closeBtn.onmouseout = () => { closeBtn.style.backgroundColor = '#3a3a3a'; };

            // Assemble dialog
            dialog.appendChild(titleEl);
            dialog.appendChild(contentContainer);
            dialog.appendChild(closeBtn);
            overlay.appendChild(dialog);

            // Close function
            const closeDialog = () => {
                document.body.removeChild(overlay);
                document.removeEventListener('keydown', escapeHandler);
            };

            // Event handlers
            const escapeHandler = (e) => {
                if (e.key === 'Escape') {
                    closeDialog();
                }
            };

            activateBtn.addEventListener('click', () => {
                console.log('Activate clicked');
                // Add your activation logic here
            });

            closeBtn.addEventListener('click', closeDialog);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    closeDialog();
                }
            });
            document.addEventListener('keydown', escapeHandler);

            // Add to DOM
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
