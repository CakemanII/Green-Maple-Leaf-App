<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Maple Leaf App</title>
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0d0d0d;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .top-nav {
            background-color: #1a1a1a;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            height: 45px;
            padding: 0 20px;
        }
        
        .nav-tabs {
            display: flex;
            gap: 4px;
            height: 100%;
            align-items: center;
        }
        
        .nav-tab {
            padding: 12px 20px;
            background-color: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #888888;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            height: 100%;
            display: flex;
            align-items: center;
        }
        
        .nav-tab:hover {
            background-color: #242424;
            color: #ffffff;
        }
        
        .nav-tab.active {
            color: #6ba3ff;
            border-bottom-color: #6ba3ff;
            background-color: #0d0d0d;
        }
        
        .content-container {
            width: 100%;
            height: calc(100vh - 45px);
            position: relative;
        }
        
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 0px;
            height: 0px;
            border: none;
            display: none;
        }
        
        iframe.active {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-tabs">
            <button id="live_interface_tab_button" class="nav-tab">Live Interface</button>
            <button id="geofence_editor_tab_button" class="nav-tab">Geofence Editor</button>
            <button id="live_data_tab_button" class="nav-tab">Live Data</button>
            <button id="preferences_tab_button" class="nav-tab">Preferences</button>
            <button id="settings_tab_button" class="nav-tab">Settings</button>
        </div>
    </nav>
    
    <div class="content-container">
        <iframe id="live_interface_tab" src="" title="Live Interface"></iframe>
        <iframe id="geofence_editor_tab" src="../geofence_editor/geofence_editor.html" title="Geofence Editor"></iframe>
        <iframe id="live_data_tab" src="" title="Live Data"></iframe>
        <iframe id="preferences_tab" src="../preferences/preferences.html" title="Preferences"></iframe>
        <iframe id="settings_tab" src="" title="Settings"></iframe>
    </div>

    <script src="./compiled_js/tab_handler.js"></script>
</body>
</html>
