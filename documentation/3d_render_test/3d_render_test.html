<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotating Dinosaur</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #1f2937 0%, #0b1020 55%, #05070f 100%);
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: #e5e7eb;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <div class="label">Dinosaur rotation speed: <strong>5°/s</strong></div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05070f, 12, 28);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.7, 8.8);
    camera.lookAt(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x223311, 1.2);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 1.7);
    dir.position.set(6, 9, 4);
    dir.castShadow = true;
    dir.shadow.mapSize.width = 2048;
    dir.shadow.mapSize.height = 2048;
    scene.add(dir);

    const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
    fill.position.set(-6, 4, -5);
    scene.add(fill);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(12, 64),
      new THREE.MeshStandardMaterial({ color: 0x23311c, roughness: 0.95, metalness: 0.02 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const shadowRing = new THREE.Mesh(
      new THREE.RingGeometry(2.4, 4.8, 64),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.14, side: THREE.DoubleSide })
    );
    shadowRing.rotation.x = -Math.PI / 2;
    shadowRing.position.y = 0.01;
    scene.add(shadowRing);

    function makeDino() {
      const group = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({
        color: 0x5f8f4b,
        roughness: 0.9,
        metalness: 0.03,
        flatShading: true
      });
      const accent = new THREE.MeshStandardMaterial({
        color: 0x7ea85f,
        roughness: 0.92,
        metalness: 0.02,
        flatShading: true
      });
      const dark = new THREE.MeshStandardMaterial({
        color: 0x304127,
        roughness: 0.95,
        metalness: 0.01,
        flatShading: true
      });

      const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.6, 1.4), skin);
      body.position.set(0, 2.2, 0);
      body.scale.set(1.2, 1, 1.2);
      body.castShadow = true;
      group.add(body);

      const chest = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 1.2), accent);
      chest.position.set(1.6, 2.1, 0);
      chest.rotation.z = -0.12;
      chest.castShadow = true;
      group.add(chest);

      const hips = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.15, 1.25), accent);
      hips.position.set(-1.65, 2.08, 0);
      hips.rotation.z = 0.1;
      hips.castShadow = true;
      group.add(hips);

      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.5, 1.1, 6), skin);
      neck.position.set(2.45, 2.75, 0);
      neck.rotation.z = -0.9;
      neck.rotation.x = Math.PI / 2;
      neck.castShadow = true;
      group.add(neck);

      const head = new THREE.Mesh(new THREE.ConeGeometry(0.62, 1.6, 6), skin);
      head.position.set(3.55, 3.02, 0);
      head.rotation.z = -Math.PI / 2;
      head.castShadow = true;
      group.add(head);

      const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.22, 0.42), accent);
      jaw.position.set(4.1, 2.72, 0);
      jaw.rotation.z = -0.12;
      jaw.castShadow = true;
      group.add(jaw);

      const tailBase = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.5, 1.5, 6), skin);
      tailBase.position.set(-2.6, 2.15, 0);
      tailBase.rotation.z = Math.PI / 2.8;
      tailBase.rotation.x = Math.PI / 2;
      tailBase.castShadow = true;
      group.add(tailBase);

      const tailTip = new THREE.Mesh(new THREE.ConeGeometry(0.3, 2.6, 6), dark);
      tailTip.position.set(-4.15, 2.12, 0);
      tailTip.rotation.z = Math.PI / 2;
      tailTip.castShadow = true;
      group.add(tailTip);

      const thighGeo = new THREE.BoxGeometry(0.65, 1.2, 0.72);
      const shinGeo = new THREE.BoxGeometry(0.42, 1.0, 0.42);
      const footGeo = new THREE.BoxGeometry(0.62, 0.22, 0.95);
      [0.52, -0.52].forEach((z) => {
        const thigh = new THREE.Mesh(thighGeo, dark);
        thigh.position.set(-0.65, 1.22, z);
        thigh.castShadow = true;
        group.add(thigh);

        const shin = new THREE.Mesh(shinGeo, dark);
        shin.position.set(-0.72, 0.45, z);
        shin.rotation.z = -0.1;
        shin.castShadow = true;
        group.add(shin);

        const foot = new THREE.Mesh(footGeo, dark);
        foot.position.set(-0.55, 0.08, z + 0.08);
        foot.castShadow = true;
        group.add(foot);
      });

      const armGeo = new THREE.BoxGeometry(0.28, 0.72, 0.28);
      [0.42, -0.42].forEach((z) => {
        const arm = new THREE.Mesh(armGeo, dark);
        arm.position.set(1.75, 1.82, z);
        arm.rotation.z = 0.55;
        arm.castShadow = true;
        group.add(arm);
      });

      for (let i = 0; i < 7; i++) {
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.12 + i * 0.01, 0.34, 5), dark);
        spike.position.set(-1.8 + i * 0.8, 3.0 - Math.abs(3 - i) * 0.05, 0);
        spike.castShadow = true;
        group.add(spike);
      }

      const eyeGeo = new THREE.SphereGeometry(0.06, 10, 10);
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, emissive: 0x111111, roughness: 0.5 });
      [0.18, -0.18].forEach((z) => {
        const eye = new THREE.Mesh(eyeGeo, eyeMat);
        eye.position.set(3.92, 3.12, z);
        group.add(eye);
      });

      group.position.y = 0;
      group.scale.set(0.95, 0.95, 0.95);
      return group;
    }

    const dinoPivot = new THREE.Group();
    scene.add(dinoPivot);

    const dinosaur = makeDino();
    dinoPivot.add(dinosaur);

    const clock = new THREE.Clock();
    const angularSpeed = THREE.MathUtils.degToRad(5); // exactly 5 degrees per second

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      dinoPivot.rotation.y = angularSpeed * t;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
